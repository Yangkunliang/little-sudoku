 document.addEventListener('click',event=>{
  const n=event.target.closest('button');if(!n||n.disabled)return;
  if(n.dataset.page){if(modal.open)closeModal();setPage(n.dataset.page);return;}
  if(n.dataset.cell!==undefined){const r=record();if(!r)return;r.selected=Number(n.dataset.cell);renderPlay();message('');touch(r);return;}
  if(n.dataset.number){fill(Number(n.dataset.number));return;}

  const r=record();
  switch(n.dataset.action){
   case 'close-modal':closeModal();break;
   case 'confirm':{const callback=modalContext.callback;closeModal();callback?.();break;}
   case 'home':closeModal();setPage('home');break;
   case 'start-type':generateNew(n.dataset.type);break;
   case 'type-rules':showRules(n.dataset.type);break;
   case 'resume-record':if(modal.open)closeModal();state.activeId=n.dataset.id;state.activeExamId=examFor(record())?.id||null;enterPlay();break;
   case 'leave':if(modal.open)closeModal();flush();setPage(r?.examId?'exams':'home');break;
   case 'focus':if(modal.open)closeModal();setFocus(!focusMode);break;
   case 'fullscreen':closeModal();fullscreen();break;
   case 'more':more();break;
   case 'rules':showRules();break;
   case 'magnify':magnify();break;
   case 'notes':if(r&&!locked(r)){r.noteMode=!r.noteMode;touch(r);renderPlay();message('');}break;
   case 'erase':if(r&&!locked(r)){if(r.puzzle.givens[r.selected])message('题目给定的数字不能清除。');else{remember(r);r.values[r.selected]=0;delete r.notes[r.selected];touch(r);renderPlay();message('');}}break;

   case 'redo':if(r&&!locked(r)&&r.redo.length){r.history.push({values:r.values.slice(),notes:E.clone(r.notes)});const next=r.redo.pop();r.values=next.values;r.notes=next.notes;touch(r);if(modal.open)closeModal();renderPlay();message('');}break;

   case 'apply-hint':{const {cell,value}=modalContext;closeModal();r.selected=cell;r.noteMode=false;fill(value);break;}
   case 'answer':showAnswer();break;
   case 'steps':showSteps();break;
